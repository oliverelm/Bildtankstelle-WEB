<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Welt mit meinen Augen | Fotogalerie</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #111; color: #fff; }
        .hero-container {
            width: 100%; height: 70vh;
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-align: center;
        }
        .hero-container h1 { font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); margin: 0; }
        .hero-container p { font-size: 1.2rem; text-shadow: 1px 1px 5px rgba(0,0,0,0.7); }
        /* Hier kommt später dein Kategorien-CSS hin */
    </style>
</head>
<body>
<div id="hero" class="hero-container">
    <h1>Die Welt mit meinen Augen</h1>
    <p>Reisen, Brücken, Augenblicke – festgehalten von Oliver</p>
</div>

<!-- HIER KOMMT DEIN KATEGORIEN-BEREICH UND SKRIPT HIN -->
<div id="kategorien-container" style="padding: 2rem; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
    <!-- Deine dynamisch geladenen Kategorien aus Google Drive -->
</div>

<script>
    // 1. Logik für das zufällige Hero-Bild
    const heroImages = [
        "hero-bruecke-hafen.jpg", 
        "hero-bruecke-nacht-1.jpg", 
        "hero-douro-tal.jpg", 
        "hero-london-nacht.jpg", 
        "hero-london-tag.jpg", 
        "hero-paris-grand-palais.jpg", 
        "hero-paris-seine.jpg", 
        "hero-porto-abend.jpg", 
        "hero-porto-nacht.jpg", 
        "hero-sevilla.jpg"
    ];
    const randomImage = heroImages[Math.floor(Math.random() * heroImages.length)];
    document.getElementById('hero').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${randomImage}')`;

    // 2. DEIN SKRIPT ZUM LADEN DER KATEGORIEN AUS DER API
    async function loadCategories() {
        try {
            const response = await fetch('/api/categories');
            const data = await response.json();
            const container = document.getElementById('kategorien-container');
            container.innerHTML = ''; // Vorherigen Inhalt leeren

            // Schleife durch deine Google Drive Ordner/Kategorien
            // (Passe diesen Teil an, je nachdem wie dein ursprüngliches Skript die Kacheln gebaut hat)
            if (data.categories) {
                data.categories.forEach(cat => {
                    const card = document.createElement('div');
                    card.style.cssText = "background: #222; border-radius: 8px; width: 250px; padding: 15px; text-align: center; cursor: pointer;";
                    card.innerHTML = `
                        <h3>${cat.name}</h3>
                        <p>${cat.count || 0} Bilder</p>
                    `;
                    container.appendChild(card);
                });
            }
        } catch (error) {
            console.error("Fehler beim Laden der Kategorien:", error);
        }
    }

    // Beim Laden der Seite ausführen
    loadCategories();
</script>

</body>
</html>
