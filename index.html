<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Welt mit meinen Augen | Fotogalerie</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: #111; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Hero-Bereich mit edler Serif-Schrift */
        .hero-container {
            width: 100%; height: 65vh;
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-align: center;
            margin-bottom: 3rem;
        }
        .hero-container h1 { 
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: 3.8rem; 
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.8); 
            margin: 0 0 15px 0; 
        }
        .hero-container p { 
            font-family: "Lora", Georgia, serif;
            font-style: italic;
            font-size: 1.4rem; 
            letter-spacing: 1px;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.8); 
            margin: 0;
            opacity: 0.95;
        }

        /* Kategorien-Grid (Große Bildkacheln) */
        #kategorien-container {
            display: flex; flex-wrap: wrap; gap: 25px; 
            justify-content: center; padding: 0 20px 50px 20px;
            flex: 1;
        }
        .card { 
            background: #222; border-radius: 4px; width: 300px; height: 400px; 
            padding: 20px; display: flex; flex-direction: column;
            text-align: left; transition: transform 0.3s; cursor: pointer;
            border: 1px solid #333;
            background-size: cover; background-position: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card:hover { transform: scale(1.02); }
        .card-content {
            margin-top: auto;
            position: relative;
            z-index: 2;
        }
        .card h3 { margin: 0 0 5px 0; color: #fff; font-size: 1.4rem; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .card p { margin: 0; color: #ddd; font-size: 0.85rem; letter-spacing: 1px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

        /* Fußbereich (Footer) */
        footer {
            background-color: #0a0a0a;
            color: #777;
            text-align: center;
            padding: 25px 20px;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        footer span { color: #555; }
        footer a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
        }
        footer a:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="hero" class="hero-container">
    <h1>Die Welt mit meinen Augen</h1>
    <p>Ein Blick. Ein Moment. Eine Geschichte.</p>
</div>

<div id="kategorien-container">
    <p style="text-align:center; color: #777;">Lade Kategorien...</p>
</div>

<footer>
    <div>© 2026 Oliver</div>
    <span>·</span>
    <a href="/">Home</a>
    <a href="/impressum.html">Impressum</a>
    <a href="/kontakt.html">Kontakt</a>
    <a href="/lizenz.html">Lizenz</a>
    <a href="/datenschutz.html">Datenschutz</a>
</footer>

<script>
    // 1. Zufälliges Hero-Bild setzen
    const heroImages = [
        "hero-bruecke-hafen.jpg", "hero-bruecke-nacht-1.jpg", "hero-douro-tal.jpg", 
        "hero-london-nacht.jpg", "hero-london-tag.jpg", "hero-paris-grand-palais.jpg", 
        "hero-paris-seine.jpg", "hero-porto-abend.jpg", "hero-porto-nacht.jpg", "hero-sevilla.jpg"
    ];
    const randomImage = heroImages[Math.floor(Math.random() * heroImages.length)];
    document.getElementById('hero').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('${randomImage}')`;

    // 2. Kategorien mit Vorschaubildern aus der API laden
    async function loadCategories() {
        try {
            const response = await fetch('/api/categories');
            const data = await response.json();
            const container = document.getElementById('kategorien-container');
            container.innerHTML = ''; 

            if (data.categories) {
                data.categories.forEach(cat => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Zuverlässiges Auslesen des Vorschaubildes aus allen gängigen API-Feldern
                    const bgImg = cat.thumbnail || cat.coverUrl || cat.cover || cat.image || cat.url || '';
                    
                    if (bgImg) {
                        card.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.1) 100%), url('${bgImg}')`;
                    }
                    
                    card.innerHTML = `
                        <div class="card-content">
                            <h3>${cat.name}</h3>
                            <p>${cat.count || 0} BILDER</p>
                        </div>
                    `;
                    card.onclick = () => window.location.href = `/category?id=${cat.id}`;
                    container.appendChild(card);
                });
            }
        } catch (error) {
            document.getElementById('kategorien-container').innerHTML = "<p style='color:#ff6b6b;'>Fehler beim Laden der Kategorien.</p>";
        }
    }

    loadCategories();
</script>

</body>
</html>
